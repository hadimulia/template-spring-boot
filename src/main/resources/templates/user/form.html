<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main :: layout}">
<head>
    <title th:text="#{user.edit}">User Form</title>
</head>
<body>
<div layout:fragment="content">
    <div th:replace="~{fragments/breadcrumb :: breadcrumb(#{user.title})}"></div>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0" th:text="${user.id != null} ? #{user.edit} : #{user.add}">User Form</h4>
        <a th:href="@{/users}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> <span th:text="#{page.back}">Back</span>
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <div th:if="${#authorization.expression('hasRole(''SYSTEM'')')}" class="mb-3">
                <label class="form-label" th:text="#{user.school}">School</label>
                <select class="form-select" disabled>
                    <option th:each="s : ${schools}" th:value="${s.id}"
                            th:selected="${s.id == selectedSchoolId}"
                            th:text="|${s.code} — ${s.name}|"></option>
                </select>
            </div>
            <form th:action="${#authorization.expression('hasRole(''SYSTEM'')') ? (user.id != null ? '/system/users/' + user.id : '/system/users') : (user.id != null ? '/users/' + user.id : '/users')}"
                  method="post" th:object="${user}">
				<input th:if="${#authorization.expression('hasRole(''SYSTEM'')')}" type="hidden" name="schoolId" th:value="${selectedSchoolId}">
				<input type="text" class="form-control" th:classappend="${#fields.hasErrors('id')} ? 'is-invalid'" id="id" th:field="*{id}" hidden="true">

                <div class="mb-3">
                    <label for="username" class="form-label" th:text="#{user.username}">Username <span class="text-danger">*</span></label>
                    <input type="text" class="form-control"
                           th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                           id="username" th:field="*{username}"
                           th:readonly="${user.id != null}"
                           >
                    <div class="invalid-feedback" th:errors="*{username}">Error</div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">
                        <span th:text="#{user.password}">Password</span> <span th:if="${user.id == null}" class="text-danger">*</span>
                        <small th:if="${user.id != null}" class="text-muted" th:text="#{user.password.keep}">(Leave empty to keep current)</small>
                    </label>
                    <input type="password" class="form-control"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                           id="password" th:field="*{password}">
                    <div class="invalid-feedback" th:errors="*{password}">Error</div>
                </div>

                <div class="mb-3">
                    <label for="fullname" class="form-label" th:text="#{user.fullname}">Full Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control"
                           th:classappend="${#fields.hasErrors('fullname')} ? 'is-invalid'"
                           id="fullname" th:field="*{fullname}">
                    <div class="invalid-feedback" th:errors="*{fullname}">Error</div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label" th:text="#{user.email}">Email</label>
                    <input type="email" class="form-control" id="email"  th:field="*{email}" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{email}">Error</div>
                </div>

                <div class="mb-3">
                    <label class="form-label" th:text="#{user.roles}">Roles</label>
                    <div class="row">
                        <div th:each="role : ${allRoles}" class="col-md-4 mb-2">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input"
                                       th:id="'role-' + ${role.id}"
                                       th:field="*{roleIds}"
                                       th:value="${role.id}">
                                <label class="form-check-label" th:for="'role-' + ${role.id}"
                                       th:text="${role.name}"></label>
                            </div>
                        </div>
                    </div>
                </div>

                <div th:if="${user.id != null}" class="mb-3">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="enabled" th:field="*{enabled}">
                        <label class="form-check-label" for="enabled" th:text="#{user.enabled}">Enabled</label>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save"></i> <span th:text="#{page.save}">Save</span>
                    </button>
                    <a th:href="@{/users}" class="btn btn-secondary">
                        <i class="bi bi-x-circle"></i> <span th:text="#{page.cancel}">Cancel</span>
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
