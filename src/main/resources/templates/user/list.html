<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main :: layout}">
<head>
    <title>User Management</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0">User Management</h4>
        <a th:if="${#authorization.expression('hasAuthority(''USER_CREATE'')')}"
           th:href="@{/users/new}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> Add User
        </a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle"></i> <span th:text="${successMessage}">Success</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle"></i> <span th:text="${errorMessage}">Error</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <form th:action="@{/users}" method="get" class="mb-3">
        <div class="input-group">
            <input type="text" name="keyword" class="form-control"
                   th:value="${keyword}" placeholder="Search username, name, or email...">
            <button type="submit" class="btn btn-outline-secondary">
                <i class="bi bi-search"></i> Search
            </button>
            <a th:href="@{/users}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-clockwise"></i> Refresh
            </a>
        </div>
    </form>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Username</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Roles</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user, stat : ${users}">
                        <td th:text="${(pagination.currentPage - 1) * pagination.pageSize + stat.index + 1}"></td>
                        <td th:text="${user.username}"></td>
                        <td th:text="${user.fullname}"></td>
                        <td th:text="${user.email}"></td>
                        <td>
                            <span th:each="role : ${user.roles}"
                                  class="badge bg-info me-1" th:text="${role}"></span>
                        </td>
                        <td>
                            <span th:if="${user.enabled}" class="badge bg-success">Active</span>
                            <span th:unless="${user.enabled}" class="badge bg-danger">Inactive</span>
                        </td>
                        <td>
                            <a th:if="${#authorization.expression('hasAuthority(''USER_EDIT'')')}"
                               th:href="@{/users/{id}/edit(id=${user.id})}"
                               class="btn btn-sm btn-warning">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:if="${#authorization.expression('hasAuthority(''USER_DELETE'')')}"
                                  th:action="@{/users/{id}/delete(id=${user.id})}"
                                  method="post" class="d-inline"
                                  onsubmit="return confirm('Are you sure you want to delete this user?')">
                                <button type="submit" class="btn btn-sm btn-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="7" class="text-center text-muted py-4">No users found</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav th:if="${pagination.totalPages > 1}" class="mt-3">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${pagination.currentPage == 1} ? 'disabled'">
                <a class="page-link" th:href="@{/users(page=1, keyword=${keyword})}">First</a>
            </li>
            <li th:each="i : ${#numbers.sequence(pagination.startPage, pagination.endPage)}"
                class="page-item"
                th:classappend="${i == pagination.currentPage} ? 'active'">
                <a class="page-link" th:href="@{/users(page=${i}, keyword=${keyword})}"
                   th:text="${i}"></a>
            </li>
            <li class="page-item"
                th:classappend="${pagination.currentPage == pagination.totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/users(page=${pagination.totalPages}, keyword=${keyword})}">Last</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
