<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main :: layout}">
<head><title>Menu Management</title></head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0">Menu Management</h4>
        <a th:if="${#authorization.expression('hasAuthority(''MENU_CREATE'')')}"
           th:href="@{/menus/new}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Add Menu</a>
    </div>
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show"><i class="bi bi-check-circle"></i> <span th:text="${successMessage}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
    <form th:action="@{/menus}" method="get" class="mb-3">
        <div class="input-group">
            <input type="text" name="keyword" class="form-control" th:value="${keyword}" placeholder="Search menus...">
            <button type="submit" class="btn btn-outline-secondary"><i class="bi bi-search"></i> Search</button>
            <a th:href="@{/menus}" class="btn btn-outline-secondary"><i class="bi bi-arrow-clockwise"></i> Refresh</a>
        </div>
    </form>
    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead><tr><th>#</th><th>Name</th><th>Parent</th><th>URL</th><th>Icon</th><th>Order</th><th>Visible</th><th>Actions</th></tr></thead>
                <tbody>
                    <tr th:each="menu, stat : ${menus}">
                        <td th:text="${(pagination.currentPage - 1) * pagination.pageSize + stat.index + 1}"></td>
                        <td th:text="${menu.name}"></td>
                        <td th:text="${menu.parentName}"></td>
                        <td><code th:text="${menu.url}"></code></td>
                        <td><i th:class="${menu.icon}"></i> <span th:text="${menu.icon}"></span></td>
                        <td th:text="${menu.sortOrder}"></td>
                        <td><span th:if="${menu.visible}" class="badge bg-success">Yes</span><span th:unless="${menu.visible}" class="badge bg-danger">No</span></td>
                        <td>
                            <a th:if="${#authorization.expression('hasAuthority(''MENU_EDIT'')')}" th:href="@{/menus/{id}/edit(id=${menu.id})}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                            <form th:if="${#authorization.expression('hasAuthority(''MENU_DELETE'')')}" th:action="@{/menus/{id}/delete(id=${menu.id})}" method="post" class="d-inline">
                                <button type="button" class="btn btn-sm btn-danger"
                                        data-bs-toggle="modal" data-bs-target="#confirmModal"
                                        data-modal-title="Delete Menu"
                                        data-modal-body="Are you sure you want to delete this menu?"
                                        data-modal-btn="Delete"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(menus)}"><td colspan="8" class="text-center text-muted py-4">No menus found</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <nav th:if="${pagination.totalPages > 1}" class="mt-3">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${pagination.currentPage == 1} ? 'disabled'"><a class="page-link" th:href="@{/menus(page=1, keyword=${keyword})}">First</a></li>
            <li th:each="i : ${#numbers.sequence(pagination.startPage, pagination.endPage)}" class="page-item" th:classappend="${i == pagination.currentPage} ? 'active'"><a class="page-link" th:href="@{/menus(page=${i}, keyword=${keyword})}" th:text="${i}"></a></li>
            <li class="page-item" th:classappend="${pagination.currentPage == pagination.totalPages} ? 'disabled'"><a class="page-link" th:href="@{/menus(page=${pagination.totalPages}, keyword=${keyword})}">Last</a></li>
        </ul>
    </nav>
</div>
</body>
</html>
