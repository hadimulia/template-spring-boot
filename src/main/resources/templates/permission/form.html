<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main :: layout}">
<head><title>Permission Form</title></head>
<body>
<div layout:fragment="content">
    <div th:replace="~{fragments/breadcrumb :: breadcrumb('Permission')}"></div>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0" th:text="${permission.id != null ? 'Edit Permission' : 'Add Permission'}">Permission Form</h4>
        <a th:href="@{/permissions}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Back</a>
    </div>
    <div class="card">
        <div class="card-body">
            <form th:action="${permission.id != null ? '/permissions/' + permission.id : '/permissions'}" method="post" th:object="${permission}">
                <div class="mb-3">
                    <label for="code" class="form-label">Code <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'" id="code" th:field="*{code}" placeholder="e.g. PERMISSION_VIEW">
                    <div class="invalid-feedback" th:errors="*{code}">Error</div>
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">Description <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'" id="description" th:field="*{description}" placeholder="e.g. View permissions">
                    <div class="invalid-feedback" th:errors="*{description}">Error</div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Save</button>
                    <a th:href="@{/permissions}" class="btn btn-secondary"><i class="bi bi-x-circle"></i> Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
