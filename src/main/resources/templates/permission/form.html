<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main :: layout}">
<head><title th:text="#{permission.edit}">Permission Form</title></head>
<body>
<div layout:fragment="content">
    <div th:replace="~{fragments/breadcrumb :: breadcrumb(#{permission.title})}"></div>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0" th:text="${permission.id != null} ? #{permission.edit} : #{permission.add}">Permission Form</h4>
        <a th:href="@{/permissions}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> <span th:text="#{page.back}">Back</span></a>
    </div>
    <div class="card">
        <div class="card-body">
            <form th:action="${permission.id != null ? '/permissions/' + permission.id : '/permissions'}" method="post" th:object="${permission}">
                <div class="mb-3">
                    <label for="code" class="form-label" th:text="#{permission.code}">Code <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'" id="code" th:field="*{code}" th:placeholder="#{permission.code.placeholder}">
                    <div class="invalid-feedback" th:errors="*{code}">Error</div>
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label" th:text="#{permission.description}">Description <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'" id="description" th:field="*{description}" th:placeholder="#{permission.description.placeholder}">
                    <div class="invalid-feedback" th:errors="*{description}">Error</div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> <span th:text="#{page.save}">Save</span></button>
                    <a th:href="@{/permissions}" class="btn btn-secondary"><i class="bi bi-x-circle"></i> <span th:text="#{page.cancel}">Cancel</span></a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
