<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main :: layout}">
<head><title th:text="#{class.management}">Class Management</title></head>
<body>
<div layout:fragment="content">
    <div th:replace="~{fragments/breadcrumb :: breadcrumb(#{class.management})}"></div>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0" th:text="#{class.management}">Class Management</h4>
        <a th:if="${#authorization.expression('hasAuthority(''CLASS_CREATE'')')}"
           th:href="@{/classes/new}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> <span th:text="#{class.add}">Add Class</span></a>
    </div>
    <span id="flashSuccess" th:if="${successMessage}" th:text="${successMessage}" class="d-none"></span>
    <span id="flashError" th:if="${errorMessage}" th:text="${errorMessage}" class="d-none"></span>
    <div class="mb-3 input-group">
        <input type="text" id="searchKeyword" class="form-control" th:value="${keyword}" th:placeholder="#{class.search.placeholder}">
        <button type="button" class="btn btn-outline-secondary" id="searchBtn"><i class="bi bi-search"></i> <span th:text="#{page.search}">Search</span></button>
        <a th:href="@{/classes}" class="btn btn-outline-secondary" id="refreshBtn"><i class="bi bi-arrow-clockwise"></i> <span th:text="#{page.refresh}">Refresh</span></a>
    </div>
    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0" id="dataTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th th:text="#{class.name}">Name</th>
                        <th th:text="#{class.grade}">Grade</th>
                        <th th:text="#{class.academicYear}">Academic Year</th>
                        <th th:text="#{class.homeroomTeacher}">Homeroom Teacher</th>
                        <th th:text="#{class.studentCount}">Students</th>
                        <th th:text="#{page.actions}">Actions</th>
                    </tr>
                </thead>
                <tbody id="dataRows">
                    <tr th:each="cls, stat : ${classes}">
                        <td th:text="${(pagination.currentPage - 1) * pagination.pageSize + stat.index + 1}"></td>
                        <td th:text="${cls.name}"></td>
                        <td th:text="${cls.grade}"></td>
                        <td th:text="${cls.academicYear}"></td>
                        <td th:text="${cls.homeroomTeacherName}"></td>
                        <td th:text="${cls.studentCount}"></td>
                        <td>
                            <a th:if="${#authorization.expression('hasAuthority(''CLASS_EDIT'')')}"
                               th:href="@{/classes/{id}/edit(id=${cls.id})}"
                               class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                            <form th:if="${#authorization.expression('hasAuthority(''CLASS_DELETE'')')}"
                                  th:action="@{/classes/{id}/delete(id=${cls.id})}"
                                  method="post" class="d-inline">
                                <button type="button" class="btn btn-sm btn-danger"
                                        data-bs-toggle="modal" data-bs-target="#confirmModal"
                                        th:data-modal-title="#{confirm.delete.class.title}"
                                        th:data-modal-body="#{confirm.delete.class.body}"
                                        th:data-modal-btn="#{modal.confirm.delete}"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(classes)}">
                        <td colspan="7" class="text-center text-muted py-4" th:text="#{class.notfound}">No classes found</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div th:replace="~{fragments/pagination :: pagination}"></div>

<script th:src="@{/js/list-manager.js}"></script>
</div>
</html>
