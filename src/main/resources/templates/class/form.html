<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main :: layout}">
<head><title th:text="#{class.edit}">Class Form</title></head>
<body>
<div layout:fragment="content">
    <div th:replace="~{fragments/breadcrumb :: breadcrumb(#{class.management})}"></div>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0" th:text="${class.id != null} ? #{class.edit} : #{class.add}">Class Form</h4>
        <a th:href="@{/classes}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> <span th:text="#{page.back}">Back</span></a>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger">
        <i class="bi bi-exclamation-triangle"></i> <span th:text="${errorMessage}"></span>
    </div>
    <div class="card">
        <div class="card-body">
            <form th:action="${class.id != null ? '/classes/' + class.id : '/classes'}" method="post" th:object="${class}">
                <input type="text" class="form-control" id="id" th:field="*{id}" hidden="true">
                <div class="mb-3">
                    <label for="name" class="form-label" th:text="#{class.name}">Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" id="name" th:field="*{name}">
                    <div class="invalid-feedback" th:errors="*{name}">Error</div>
                </div>
                <div class="mb-3">
                    <label for="grade" class="form-label" th:text="#{class.grade}">Grade</label>
                    <input type="text" class="form-control" id="grade" th:field="*{grade}">
                </div>
                <div class="mb-3">
                    <label for="academicYear" class="form-label" th:text="#{class.academicYear}">Academic Year</label>
                    <input type="text" class="form-control" id="academicYear" th:field="*{academicYear}">
                </div>
                <div class="mb-3">
                    <label for="homeroomTeacherId" class="form-label" th:text="#{class.homeroomTeacher}">Homeroom Teacher</label>
                    <select class="form-select" id="homeroomTeacherId" th:field="*{homeroomTeacherId}">
                        <option value="" th:text="#{class.noTeacher}">-- No Teacher --</option>
                        <option th:each="t : ${allTeachers}" th:value="${t.id}" th:text="${t.fullname}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label" th:text="#{class.students}">Students</label>
                    <div class="row">
                        <div th:each="s : ${allStudents}" class="col-md-4 mb-2">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input"
                                       th:id="'student-' + ${s.id}"
                                       th:field="*{studentIds}"
                                       th:value="${s.id}"
                                       th:checked="${selectedStudentIds.contains(s.id)}">
                                <label class="form-check-label" th:for="'student-' + ${s.id}"
                                       th:text="${s.fullname} + ' (' + ${s.nis} + ')'"></label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> <span th:text="#{page.save}">Save</span></button>
                    <a th:href="@{/classes}" class="btn btn-secondary"><i class="bi bi-x-circle"></i> <span th:text="#{page.cancel}">Cancel</span></a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
