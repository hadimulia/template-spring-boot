<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main :: layout}">
<head><title th:text="#{school.management}">School Management</title></head>
<body>
<div layout:fragment="content">
    <div th:replace="~{fragments/breadcrumb :: breadcrumb(#{school.title})}"></div>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0" th:text="#{school.management}">School Management</h4>
        <a th:if="${#authorization.expression('hasAuthority(''SCHOOL_CREATE'')')}"
           th:href="@{/schools/new}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> <span th:text="#{school.add}">Add School</span></a>
    </div>
    <span id="flashSuccess" th:if="${successMessage}" th:text="${successMessage}" class="d-none"></span>
    <span id="flashError" th:if="${errorMessage}" th:text="${errorMessage}" class="d-none"></span>
    <div class="mb-3 input-group">
        <input type="text" id="searchKeyword" class="form-control" th:value="${keyword}" th:placeholder="#{school.search.placeholder}">
        <button type="button" class="btn btn-outline-secondary" id="searchBtn"><i class="bi bi-search"></i> <span th:text="#{page.search}">Search</span></button>
        <a th:href="@{/schools}" class="btn btn-outline-secondary" id="refreshBtn"><i class="bi bi-arrow-clockwise"></i> <span th:text="#{page.refresh}">Refresh</span></a>
    </div>
    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0" id="dataTable">
                <thead><tr><th>#</th><th th:text="#{school.code}">Code</th><th th:text="#{school.name}">Name</th><th th:text="#{school.dbname}">Database</th><th th:text="#{school.description}">Description</th><th th:text="#{school.status}">Status</th><th th:text="#{page.actions}">Actions</th></tr></thead>
                <tbody id="dataRows">
                    <tr th:each="school, stat : ${schools}">
                        <td th:text="${(pagination.currentPage - 1) * pagination.pageSize + stat.index + 1}"></td>
                        <td th:text="${school.code}"></td>
                        <td th:text="${school.name}"></td>
                        <td><code th:text="${school.dbName}"></code></td>
                        <td th:text="${school.description}"></td>
                        <td>
                            <span th:if="${school.status == 'ACTIVE'}" class="badge bg-success" th:text="#{school.status.active}">Active</span>
                            <span th:if="${school.status != 'ACTIVE'}" class="badge bg-secondary" th:text="#{school.status.inactive}">Inactive</span>
                        </td>
                        <td>
                            <a th:if="${#authorization.expression('hasAuthority(''SCHOOL_EDIT'')')}" th:href="@{/schools/{id}/edit(id=${school.id})}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                            <form th:if="${#authorization.expression('hasAuthority(''SCHOOL_DELETE'')')}" th:action="@{/schools/{id}/delete(id=${school.id})}" method="post" class="d-inline">
                                <button type="button" class="btn btn-sm btn-danger"
                                        data-bs-toggle="modal" data-bs-target="#confirmModal"
                                        th:data-modal-title="#{confirm.delete.school.title}"
                                        th:data-modal-body="#{confirm.delete.school.body}"
                                        th:data-modal-btn="#{modal.confirm.delete}"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(schools)}"><td colspan="7" class="text-center text-muted py-4" th:text="#{school.notfound}">No schools found</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <div th:replace="~{fragments/pagination :: pagination}"></div>

<script th:src="@{/js/list-manager.js}"></script>
<script th:src="@{/js/schools/data-render.js}"></script>
</div>
</body>
</html>
