<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main :: layout}">
<head><title th:text="#{session.title}">Active Sessions</title></head>
<body>
<div layout:fragment="content">
    <div th:replace="~{fragments/breadcrumb :: breadcrumb(#{session.breadcrumb})}"></div>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0"><i class="bi bi-people"></i> <span th:text="#{session.title}">Active Sessions</span></h4>
    </div>

    <span id="flashSuccess" th:if="${successMessage}" th:text="${successMessage}" class="d-none"></span>
    <span id="flashError" th:if="${errorMessage}" th:text="${errorMessage}" class="d-none"></span>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>#</th>
                        <th th:text="#{user.username}">Username</th>
                        <th th:text="#{user.fullname}">Full Name</th>
                        <th th:text="#{session.ip}">IP Address</th>
                        <th th:text="#{session.browser}">Browser</th>
                        <th th:text="#{session.loginTime}">Login Time</th>
                        <th th:text="#{session.status}">Status</th>
                        <th th:text="#{page.action}">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="s, stat : ${sessions}">
                        <td th:text="${stat.index + 1}"></td>
                        <td th:text="${s.username}"></td>
                        <td th:text="${s.fullname}"></td>
                        <td th:text="${s.ipAddress}"></td>
                        <td style="max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"
                            th:text="${s.browser}"></td>
                        <td th:text="${s.loginTime} ? ${#strings.substring(s.loginTime.toString(), 0, 16)} : '-'"></td>
                        <td>
                            <span th:if="${s.currentSession}" class="badge bg-success" th:text="#{session.current}">Current</span>
                            <span th:unless="${s.currentSession}" class="badge bg-secondary" th:text="#{session.active}">Active</span>
                        </td>
                        <td>
                            <form th:if="${!s.currentSession}" th:action="@{/sessions/force-logout}" method="post" style="display:inline;">
                                <input type="hidden" name="sessionId" th:value="${s.sessionId}">
                                <button type="button" class="btn btn-danger btn-sm"
                                        data-bs-toggle="modal" data-bs-target="#confirmModal"
                                        th:data-modal-title="#{confirm.session.forceLogout.title}"
                                        th:data-modal-body="#{confirm.session.forceLogout.body}"
                                        th:data-modal-btn="#{confirm.session.forceLogout.btn}"
                                        data-modal-btn-class="btn btn-danger">
                                    <i class="bi bi-x-circle"></i> <span th:text="#{session.kick}">Kick</span>
                                </button>
                            </form>
                            <span th:if="${s.currentSession}" class="text-muted">—</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(sessions)}">
                        <td colspan="8" class="text-center text-muted py-4" th:text="#{session.none}">No active sessions</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
