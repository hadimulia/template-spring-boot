<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main :: layout}">
<head><title th:text="#{student.edit}">Student Form</title></head>
<body>
<div layout:fragment="content">
    <div th:replace="~{fragments/breadcrumb :: breadcrumb(#{student.management})}"></div>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0" th:text="${student.id != null} ? #{student.edit} : #{student.add}">Student Form</h4>
        <a th:href="@{/students}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> <span th:text="#{page.back}">Back</span></a>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger">
        <i class="bi bi-exclamation-triangle"></i> <span th:text="${errorMessage}"></span>
    </div>
    <div class="card">
        <div class="card-body">
            <form th:action="${student.id != null ? '/students/' + student.id : '/students'}" method="post" th:object="${student}">
                <input type="text" class="form-control" id="id" th:field="*{id}" hidden="true">
                <div class="mb-3">
                    <label for="nis" class="form-label" th:text="#{student.nis}">NIS <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" th:classappend="${#fields.hasErrors('nis')} ? 'is-invalid'" id="nis" th:field="*{nis}" th:readonly="${student.id != null}">
                    <div class="invalid-feedback" th:errors="*{nis}">Error</div>
                </div>
                <div class="mb-3">
                    <label for="fullname" class="form-label" th:text="#{student.fullname}">Full Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" th:classappend="${#fields.hasErrors('fullname')} ? 'is-invalid'" id="fullname" th:field="*{fullname}">
                    <div class="invalid-feedback" th:errors="*{fullname}">Error</div>
                </div>
                <div class="mb-3">
                    <label for="gender" class="form-label" th:text="#{student.gender}">Gender</label>
                    <select class="form-select" id="gender" th:field="*{gender}">
                        <option value="" th:text="--"></option>
                        <option value="L" th:text="#{gender.male}">Laki-laki</option>
                        <option value="P" th:text="#{gender.female}">Perempuan</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="birthDate" class="form-label" th:text="#{student.birthDate}">Birth Date</label>
                    <input type="date" class="form-control" id="birthDate" th:field="*{birthDate}">
                </div>
                <div class="mb-3">
                    <label for="address" class="form-label" th:text="#{student.address}">Address</label>
                    <textarea class="form-control" id="address" rows="2" th:field="*{address}"></textarea>
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label" th:text="#{student.phone}">Phone</label>
                    <input type="text" class="form-control" id="phone" th:field="*{phone}">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label" th:text="#{student.email}">Email</label>
                    <input type="email" class="form-control" id="email" th:field="*{email}">
                </div>
                <div class="mb-3">
                    <label for="enrollmentStatus" class="form-label" th:text="#{student.enrollmentStatus}">Status</label>
                    <select class="form-select" id="enrollmentStatus" th:field="*{enrollmentStatus}">
                        <option value="ACTIVE" th:text="#{student.active}">Active</option>
                        <option value="INACTIVE" th:text="#{student.inactive}">Inactive</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="classId" class="form-label" th:text="#{student.class}">Class</label>
                    <select class="form-select" id="classId" th:field="*{classId}">
                        <option value="" th:text="#{student.noClass}">-- No Class --</option>
                        <option th:each="c : ${allClasses}" th:value="${c.id}" th:text="${c.name}"></option>
                    </select>
                </div>
                <div th:if="${student.id == null}" class="mb-3">
                    <label for="password" class="form-label" th:text="#{user.password}">Password <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" id="password" th:field="*{password}">
                    <div class="invalid-feedback" th:errors="*{password}">Error</div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> <span th:text="#{page.save}">Save</span></button>
                    <a th:href="@{/students}" class="btn btn-secondary"><i class="bi bi-x-circle"></i> <span th:text="#{page.cancel}">Cancel</span></a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
