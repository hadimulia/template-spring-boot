<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main :: layout}">
<head><title th:text="#{student.management}">Student Management</title></head>
<body>
<div layout:fragment="content">
    <div th:replace="~{fragments/breadcrumb :: breadcrumb(#{student.management})}"></div>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0" th:text="#{student.management}">Student Management</h4>
        <a th:if="${#authorization.expression('hasAuthority(''STUDENT_CREATE'')')}"
           th:href="@{/students/new}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> <span th:text="#{student.add}">Add Student</span></a>
    </div>
    <span id="flashSuccess" th:if="${successMessage}" th:text="${successMessage}" class="d-none"></span>
    <span id="flashError" th:if="${errorMessage}" th:text="${errorMessage}" class="d-none"></span>
    <div class="mb-3 input-group">
        <input type="text" id="searchKeyword" class="form-control" th:value="${keyword}" th:placeholder="#{student.search.placeholder}">
        <button type="button" class="btn btn-outline-secondary" id="searchBtn"><i class="bi bi-search"></i> <span th:text="#{page.search}">Search</span></button>
        <a th:href="@{/students}" class="btn btn-outline-secondary" id="refreshBtn"><i class="bi bi-arrow-clockwise"></i> <span th:text="#{page.refresh}">Refresh</span></a>
    </div>
    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0" id="dataTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th th:text="#{student.nis}">NIS</th>
                        <th th:text="#{student.fullname}">Full Name</th>
                        <th th:text="#{student.gender}">Gender</th>
                        <th th:text="#{student.phone}">Phone</th>
                        <th th:text="#{student.enrollmentStatus}">Status</th>
                        <th th:text="#{page.actions}">Actions</th>
                    </tr>
                </thead>
                <tbody id="dataRows">
                    <tr th:each="student, stat : ${students}">
                        <td th:text="${(pagination.currentPage - 1) * pagination.pageSize + stat.index + 1}"></td>
                        <td th:text="${student.nis}"></td>
                        <td th:text="${student.fullname}"></td>
                        <td th:text="${student.gender}"></td>
                        <td th:text="${student.phone}"></td>
                        <td>
                            <span th:if="${student.enrollmentStatus == 'ACTIVE'}" class="badge bg-success" th:text="#{student.active}">Active</span>
                            <span th:unless="${student.enrollmentStatus == 'ACTIVE'}" class="badge bg-danger" th:text="#{student.inactive}">Inactive</span>
                        </td>
                        <td>
                            <a th:if="${#authorization.expression('hasAuthority(''STUDENT_EDIT'')')}"
                               th:href="@{/students/{id}/edit(id=${student.id})}"
                               class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                            <form th:if="${#authorization.expression('hasAuthority(''STUDENT_DELETE'')')}"
                                  th:action="@{/students/{id}/delete(id=${student.id})}"
                                  method="post" class="d-inline">
                                <button type="button" class="btn btn-sm btn-danger"
                                        data-bs-toggle="modal" data-bs-target="#confirmModal"
                                        th:data-modal-title="#{confirm.delete.student.title}"
                                        th:data-modal-body="#{confirm.delete.student.body}"
                                        th:data-modal-btn="#{modal.confirm.delete}"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(students)}">
                        <td colspan="7" class="text-center text-muted py-4" th:text="#{student.notfound}">No students found</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div th:replace="~{fragments/pagination :: pagination}"></div>

<script th:src="@{/js/list-manager.js}"></script>
</div>
</html>
