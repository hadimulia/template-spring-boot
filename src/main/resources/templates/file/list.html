<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main :: layout}">
<head><title th:text="#{file.title}">File Manager</title></head>
<body>
<div layout:fragment="content">
    <div th:replace="~{fragments/breadcrumb :: breadcrumb(#{file.breadcrumb})}"></div>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0" th:text="#{file.title}">File Manager</h4>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#uploadModal">
            <i class="bi bi-upload"></i> <span th:text="#{file.upload}">Upload File</span>
        </button>
    </div>
    <span id="flashSuccess" th:if="${successMessage}" th:text="${successMessage}" class="d-none"></span>
    <span id="flashError" th:if="${errorMessage}" th:text="${errorMessage}" class="d-none"></span>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>#</th>
                        <th th:text="#{file.name}">File Name</th>
                        <th th:text="#{file.type}">Type</th>
                        <th th:text="#{file.size}">Size</th>
                        <th th:text="#{file.entity}">Entity</th>
                        <th th:text="#{file.uploadedBy}">Uploaded By</th>
                        <th th:text="#{file.date}">Date</th>
                        <th th:text="#{page.actions}">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="file, stat : ${fileList}">
                        <td th:text="${stat.index + 1}"></td>
                        <td th:text="${file.originalName}"></td>
                        <td><span class="badge bg-secondary" th:text="${file.contentType}"></span></td>
                        <td>
                            <span th:if="${file.fileSize < 1024}" th:text="${file.fileSize} + ' B'"></span>
                            <span th:if="${file.fileSize >= 1024 and file.fileSize < 1048576}" th:text="${#numbers.formatDecimal(file.fileSize / 1024, 1, 1)} + ' KB'"></span>
                            <span th:if="${file.fileSize >= 1048576}" th:text="${#numbers.formatDecimal(file.fileSize / 1048576, 1, 2)} + ' MB'"></span>
                        </td>
                        <td th:text="${file.entityType}"></td>
                        <td th:text="${file.createdBy}"></td>
                        <td th:text="${file.createdDate}"></td>
                        <td>
                            <a th:href="@{/files/{id}/download(id=${file.id})}" class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-download"></i>
                            </a>
                            <form th:action="@{/files/{id}/delete(id=${file.id})}" method="post" class="d-inline">
                                <button type="button" class="btn btn-sm btn-danger"
                                        data-bs-toggle="modal" data-bs-target="#confirmModal"
                                        th:data-modal-title="#{confirm.delete.file.title}"
                                        th:data-modal-body="#{confirm.delete.file.body}"
                                        th:data-modal-btn="#{modal.confirm.delete}"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(fileList)}">
                        <td colspan="8" class="text-center text-muted py-4" th:text="#{file.none}">No files uploaded yet</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Upload Modal -->
    <div class="modal fade" id="uploadModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form th:action="@{/files/upload}" method="post" enctype="multipart/form-data">
                    <div class="modal-header">
                        <h5 class="modal-title" th:text="#{file.upload.modal.title}">Upload File</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label" th:text="#{file.upload.label}">File</label>
                            <input type="file" class="form-control" name="file" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" th:text="#{file.upload.entityType}">Entity Type</label>
                            <select class="form-select" name="entityType" required>
                                <option value="" th:text="#{file.upload.entityType.select}">-- Select --</option>
                                <option value="USER" th:text="#{file.entityType.user}">User</option>
                                <option value="PROFILE" th:text="#{file.entityType.profile}">Profile</option>
                                <option value="DOCUMENT" th:text="#{file.entityType.document}">Document</option>
                                <option value="OTHER" th:text="#{file.entityType.other}">Other</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" th:text="#{file.upload.entityId}">Entity ID (optional)</label>
                            <input type="number" class="form-control" name="entityId">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" th:text="#{modal.confirm.cancel}">Cancel</button>
                        <button type="submit" class="btn btn-primary" th:text="#{file.upload.submit}">Upload</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</html>
