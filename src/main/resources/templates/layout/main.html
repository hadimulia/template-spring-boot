<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">Template App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/custom.css(v=${#dates.createNow().time})}" rel="stylesheet">
</head>
<body>
    <div th:replace="~{layout/header :: header}"></div>

    <div sec:authorize="isAuthenticated()">
        <div class="sidebar-col bg-dark">
            <div th:replace="~{layout/sidebar :: sidebar}"></div>
        </div>
        <div class="content-col p-4">
            <div layout:fragment="content">
            </div>
        </div>
    </div>

    <div sec:authorize="!isAuthenticated()">
        <div layout:fragment="auth-content">
        </div>
    </div>

    <div th:replace="~{layout/footer :: footer}"></div>

    <!-- Confirm Modal -->
    <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="confirmModalTitle" th:text="#{modal.confirm.title}">Confirm</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="confirmModalBody" th:text="#{modal.confirm.body}">
                    Are you sure?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" th:text="#{modal.confirm.cancel}">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirmModalBtn" th:text="#{modal.confirm.delete}">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div th:replace="~{fragments/toast :: toast}"></div>

    <script th:inline="javascript">
        const appI18n = {
            confirmDeleteMenuTitle: /*[[#{confirm.delete.menu.title}]]*/ '',
            confirmDeleteMenuBody: /*[[#{confirm.delete.menu.body}]]*/ '',
            confirmDeleteUserTitle: /*[[#{confirm.delete.user.title}]]*/ '',
            confirmDeleteUserBody: /*[[#{confirm.delete.user.body}]]*/ '',
            confirmDeleteRoleTitle: /*[[#{confirm.delete.role.title}]]*/ '',
            confirmDeleteRoleBody: /*[[#{confirm.delete.role.body}]]*/ '',
            confirmDeletePermissionTitle: /*[[#{confirm.delete.permission.title}]]*/ '',
            confirmDeletePermissionBody: /*[[#{confirm.delete.permission.body}]]*/ '',
            modalConfirmDelete: /*[[#{modal.confirm.delete}]]*/ '',
            sessionForceLogoutTitle: /*[[#{confirm.session.forceLogout.title}]]*/ '',
            sessionForceLogoutBody: /*[[#{confirm.session.forceLogout.body}]]*/ '',
            sessionForceLogoutBtn: /*[[#{confirm.session.forceLogout.btn}]]*/ '',
            userActive: /*[[#{user.active}]]*/ '',
            userInactive: /*[[#{user.inactive}]]*/ '',
            loading: 'Loading...',
            noData: /*[[#{page.list}]]*/ 'No data found',
            yes: /*[[#{page.yes}]]*/ '',
            no: /*[[#{page.no}]]*/ '',
        };
    </script>
    <script th:src="@{/js/theme.js}"></script>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/app.js}"></script>
    <script th:src="@{/js/toast.js}"></script>
</body>
</html>
