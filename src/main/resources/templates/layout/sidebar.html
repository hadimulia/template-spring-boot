<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
    <div th:fragment="sidebar" class="d-flex flex-column p-3 text-white bg-dark h-100">
        <h5 class="mb-3">
            <i class="bi bi-menu-button-wide"></i> Menu
        </h5>
        <ul class="nav nav-pills flex-column mb-auto">
            <li th:each="menu : ${menuTree}" class="nav-item">
                <!-- Menu with URL (leaf menu) -->
                <a th:if="${menu.url != null}" th:href="@{${menu.url}}"
                   class="nav-link text-white"
                   th:classappend="${menu.active} ? 'active'">
                    <i th:class="${menu.icon} + ' me-2'"></i>
                    <span th:text="${menu.name}">Menu</span>
                </a>

                <!-- Menu without URL but has children (parent menu) -->
                <div th:if="${menu.url == null and !#lists.isEmpty(menu.children)}">
                    <a class="nav-link text-white collapsed"
                       data-bs-toggle="collapse"
                       th:href="'#submenu-' + ${menu.id}"
                       th:aria-expanded="${menu.active}"
                       th:classappend="${menu.active} ? '' : 'collapsed'">
                        <i th:class="${menu.icon} + ' me-2'"></i>
                        <span th:text="${menu.name}">Parent</span>
                        <i class="bi bi-chevron-down float-end"></i>
                    </a>
                    <div th:id="'submenu-' + ${menu.id}" class="collapse"
                         th:classappend="${menu.active} ? 'show'">
                        <ul class="nav flex-column ms-3">
                            <li th:each="child : ${menu.children}" class="nav-item">
                                <a th:href="@{${child.url}}" class="nav-link text-white"
                                   th:classappend="${child.active} ? 'active'">
                                    <i th:class="${child.icon} + ' me-2'"></i>
                                    <span th:text="${child.name}">Submenu</span>
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </li>
        </ul>
    </div>
</body>
</html>
