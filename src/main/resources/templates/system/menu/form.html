<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main :: layout}">
<head><title th:text="#{menu.edit}">Menu Form</title></head>
<body>
<div layout:fragment="content">
    <div th:replace="~{fragments/breadcrumb :: breadcrumb(#{menu.title})}"></div>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0" th:text="${menu.id != null} ? #{menu.edit} : #{menu.add}">Menu Form</h4>
        <a th:href="@{/system/menus}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> <span th:text="#{page.back}">Back</span></a>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger">
        <i class="bi bi-exclamation-triangle"></i> <span th:text="${errorMessage}"></span>
    </div>
    <div class="card">
        <div class="card-body">
            <form th:action="${menu.id != null ? '/system/menus/' + menu.id : '/system/menus'}" method="post" th:object="${menu}">
            	<input type="text" class="form-control" th:classappend="${#fields.hasErrors('id')} ? 'is-invalid'" id="id" th:field="*{id}" hidden="true">
                <div class="mb-3">
                    <label for="name" class="form-label" th:text="#{menu.name}">Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" id="name" th:field="*{name}">
                    <div class="invalid-feedback" th:errors="*{name}">Error</div>
                </div>
                <div class="mb-3">
                    <label for="parentId" class="form-label" th:text="#{menu.parent}">Parent Menu</label>
                    <select class="form-select" id="parentId" th:field="*{parentId}">
                        <option value="" th:text="#{menu.parent.none}">-- No Parent --</option>
                        <option th:each="parent : ${parentMenus}" th:value="${parent.id}" th:text="${parent.name}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="url" class="form-label" th:text="#{menu.url}">URL</label>
                    <input type="text" class="form-control" id="url" th:field="*{url}" th:placeholder="#{menu.url.placeholder}">
                </div>
                <div class="mb-3">
                    <label for="icon" class="form-label" th:text="#{menu.icon}">Icon</label>
                    <input type="text" class="form-control" id="icon" th:field="*{icon}" th:placeholder="#{menu.icon.placeholder}">
                </div>
                <div class="mb-3">
                    <label for="sortOrder" class="form-label" th:text="#{menu.sortOrder}">Sort Order</label>
                    <input type="number" class="form-control" id="sortOrder" th:field="*{sortOrder}">
                </div>
                <div class="mb-3">
                    <label for="i18nKey" class="form-label" th:text="#{menu.i18nKey}">i18n Key</label>
                    <input type="text" class="form-control" id="i18nKey" th:field="*{i18nKey}" placeholder="sidebar.mymenu">
                    <div class="form-text text-muted" th:text="#{menu.i18nKey.help}">Leave empty to use DB name. Set to an existing or new message property key.</div>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="visible" th:field="*{visible}">
                    <label class="form-check-label" for="visible" th:text="#{menu.visible}">Visible</label>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> <span th:text="#{page.save}">Save</span></button>
                    <a th:href="@{/system/menus}" class="btn btn-secondary"><i class="bi bi-x-circle"></i> <span th:text="#{page.cancel}">Cancel</span></a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
