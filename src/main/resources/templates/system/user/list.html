<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main :: layout}">
<head><title th:text="#{user.management}">User Management</title></head>
<body>
<div layout:fragment="content">
    <div th:replace="~{fragments/breadcrumb :: breadcrumb(#{user.title})}"></div>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0" th:text="#{user.management}">User Management</h4>
        <div class="btn-group">
            <a th:href="@{/system/users/system/new}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> <span th:text="#{user.add}">Add User</span></a>
        </div>
    </div>
    <span id="flashSuccess" th:if="${successMessage}" th:text="${successMessage}" class="d-none"></span>
    <span id="flashError" th:if="${errorMessage}" th:text="${errorMessage}" class="d-none"></span>
    <div class="mb-3 input-group">
        <input type="text" id="searchKeyword" class="form-control"
               th:value="${keyword}" th:placeholder="#{user.search.placeholder}">
        <button type="button" class="btn btn-outline-secondary" id="searchBtn"><i class="bi bi-search"></i> <span th:text="#{page.search}">Search</span></button>
        <a th:href="@{/system/users/system}" class="btn btn-outline-secondary" id="refreshBtn"><i class="bi bi-arrow-clockwise"></i> <span th:text="#{page.refresh}">Refresh</span></a>
    </div>
    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0" id="dataTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th th:text="#{user.username}">Username</th>
                        <th th:text="#{user.fullname}">Full Name</th>
                        <th th:text="#{user.email}">Email</th>
                        <th th:text="#{user.roles}">Roles</th>
                        <th th:text="#{user.status}">Status</th>
                        <th th:text="#{page.actions}">Actions</th>
                    </tr>
                </thead>
                <tbody id="dataRows">
                    <tr th:each="user, stat : ${users}">
                        <td th:text="${(pagination.currentPage - 1) * pagination.pageSize + stat.index + 1}"></td>
                        <td th:text="${user.username}"></td>
                        <td th:text="${user.fullname}"></td>
                        <td th:text="${user.email}"></td>
                        <td>
                            <span th:each="role : ${user.roles}"
                                  class="badge bg-info me-1" th:text="${role}"></span>
                        </td>
                        <td>
                            <span th:if="${user.enabled}" class="badge bg-success" th:text="#{user.active}">Active</span>
                            <span th:unless="${user.enabled}" class="badge bg-danger" th:text="#{user.inactive}">Inactive</span>
                        </td>
                        <td>
                            <a th:href="@{/system/users/system/{id}/edit(id=${user.id})}"
                               class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/system/users/system/{id}/delete(id=${user.id})}"
                                  method="post" class="d-inline">
                                <button type="button" class="btn btn-sm btn-danger"
                                        data-bs-toggle="modal" data-bs-target="#confirmModal"
                                        th:data-modal-title="#{confirm.delete.user.title}"
                                        th:data-modal-body="#{confirm.delete.user.body}"
                                        th:data-modal-btn="#{modal.confirm.delete}"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="7" class="text-center text-muted py-4" th:text="#{user.notfound}">No users found</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div th:replace="~{fragments/pagination :: pagination}"></div>

<script th:src="@{/js/list-manager.js}"></script>
</div>
</html>
