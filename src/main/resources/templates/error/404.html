<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main :: layout}">
<head><title>404 - Not Found</title></head>
<body>
<div layout:fragment="content">
    <div class="text-center py-5">
        <h1 class="display-1 text-warning">404</h1>
        <h4 class="mb-3">Page Not Found</h4>
        <p class="text-muted" th:text="${message}">The page you are looking for does not exist.</p>
        <a th:href="@{/}" class="btn btn-primary"><i class="bi bi-house"></i> Back to Dashboard</a>
    </div>
</div>
</body>
</html>
