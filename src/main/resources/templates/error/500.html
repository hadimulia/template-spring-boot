<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main :: layout}">
<head><title>500 - Server Error</title></head>
<body>
<div layout:fragment="content">
    <div class="text-center py-5">
        <h1 class="display-1 text-danger">500</h1>
        <h4 class="mb-3">Internal Server Error</h4>
        <p class="text-muted" th:text="${message}">An unexpected error occurred.</p>
        <p class="text-muted small" th:if="${detail}" th:text="${detail}"></p>
        <a th:href="@{/}" class="btn btn-primary"><i class="bi bi-house"></i> Back to Dashboard</a>
    </div>
</div>
</body>
</html>
