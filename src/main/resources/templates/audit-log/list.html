<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main :: layout}">
<head><title>Audit Trail</title></head>
<body>
<div layout:fragment="content">
    <div th:replace="~{fragments/breadcrumb :: breadcrumb('Audit Trail')}"></div>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0">Audit Trail</h4>
    </div>
    <span id="flashSuccess" th:if="${successMessage}" th:text="${successMessage}" class="d-none"></span>
    <div class="mb-3 input-group">
        <input type="text" id="searchKeyword" class="form-control" th:value="${keyword}" placeholder="Search entity, action, user, or description...">
        <button type="button" class="btn btn-outline-secondary" id="searchBtn"><i class="bi bi-search"></i> Search</button>
        <a th:href="@{/audit-logs}" class="btn btn-outline-secondary" id="refreshBtn"><i class="bi bi-arrow-clockwise"></i> Refresh</a>
    </div>
    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0" id="dataTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Timestamp</th>
                        <th>User</th>
                        <th>Entity</th>
                        <th>Action</th>
                        <th>Description</th>
                        <th>IP Address</th>
                    </tr>
                </thead>
                <tbody id="dataRows">
                    <tr th:each="log, stat : ${logs}">
                        <td th:text="${(pagination.currentPage - 1) * pagination.pageSize + stat.index + 1}"></td>
                        <td style="white-space:nowrap" th:text="${log.performedAt} ? ${#temporals.format(log.performedAt, 'yyyy-MM-dd HH:mm')} : '-'"></td>
                        <td th:text="${log.performedBy}"></td>
                        <td><span class="badge bg-secondary" th:text="${log.entityType}"></span></td>
                        <td>
                            <span th:if="${log.action == 'CREATE'}" class="badge bg-success">CREATE</span>
                            <span th:if="${log.action == 'UPDATE'}" class="badge bg-primary">UPDATE</span>
                            <span th:if="${log.action == 'DELETE'}" class="badge bg-danger">DELETE</span>
                            <span th:if="${log.action != 'CREATE' and log.action != 'UPDATE' and log.action != 'DELETE'}" class="badge bg-info" th:text="${log.action}"></span>
                        </td>
                        <td th:text="${log.description}" style="max-width:300px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></td>
                        <td><code th:text="${log.ipAddress}"></code></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(logs)}"><td colspan="7" class="text-center text-muted py-4">No audit logs found</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <div th:replace="~{fragments/pagination :: pagination}"></div>

<script th:src="@{/js/list-manager.js}"></script>
<script th:src="@{/js/audit-logs/data-render.js}"></script>
</div>
</html>
