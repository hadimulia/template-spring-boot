<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="pagination">
    <nav th:if="${pagination.totalPages > 1}" class="mt-3">
        <ul class="pagination justify-content-center" id="pagination">
            <li class="page-item" th:classappend="${pagination.currentPage == 1} ? 'disabled'">
                <a class="page-link page-link-ajax" th:attr="data-page=1">First</a>
            </li>
            <li th:each="i : ${#numbers.sequence(pagination.startPage, pagination.endPage)}"
                class="page-item"
                th:classappend="${i == pagination.currentPage} ? 'active'">
                <a class="page-link page-link-ajax" th:attr="data-page=${i}" th:text="${i}"></a>
            </li>
            <li class="page-item" th:classappend="${pagination.currentPage == pagination.totalPages} ? 'disabled'">
                <a class="page-link page-link-ajax" th:attr="data-page=${pagination.totalPages}">Last</a>
            </li>
        </ul>
    </nav>
    <nav th:if="${pagination.totalPages <= 1}" class="mt-3" style="display:none">
        <ul class="pagination justify-content-center" id="pagination"></ul>
    </nav>
</div>
</body>
</html>
