<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="toast">
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1080;" id="toastContainer">
        <div class="toast" id="toastSuccess" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header text-success">
                <i class="bi bi-check-circle me-2"></i>
                <strong class="me-auto" th:text="#{toast.success}">Success</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastSuccessBody"></div>
        </div>
        <div class="toast" id="toastError" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header text-danger">
                <i class="bi bi-exclamation-triangle me-2"></i>
                <strong class="me-auto" th:text="#{toast.error}">Error</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastErrorBody"></div>
        </div>
        <div class="toast" id="toastWarning" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header text-warning">
                <i class="bi bi-exclamation-circle me-2"></i>
                <strong class="me-auto" th:text="#{toast.warning}">Warning</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastWarningBody"></div>
        </div>
        <div class="toast" id="toastInfo" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header text-info">
                <i class="bi bi-info-circle me-2"></i>
                <strong class="me-auto" th:text="#{toast.info}">Info</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastInfoBody"></div>
        </div>
    </div>
</div>
</body>
</html>
