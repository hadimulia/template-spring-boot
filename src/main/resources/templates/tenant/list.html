<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main :: layout}">
<head><title th:text="#{tenant.management}">Tenant Management</title></head>
<body>
<div layout:fragment="content">
    <div th:replace="~{fragments/breadcrumb :: breadcrumb(#{tenant.title})}"></div>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0" th:text="#{tenant.management}">Tenant Management</h4>
        <a th:if="${#authorization.expression('hasAuthority(''TENANT_CREATE'')')}"
           th:href="@{/tenants/new}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> <span th:text="#{tenant.add}">Add Tenant</span></a>
    </div>
    <span id="flashSuccess" th:if="${successMessage}" th:text="${successMessage}" class="d-none"></span>
    <div class="mb-3 input-group">
        <input type="text" id="searchKeyword" class="form-control" th:value="${keyword}" th:placeholder="#{tenant.search.placeholder}">
        <button type="button" class="btn btn-outline-secondary" id="searchBtn"><i class="bi bi-search"></i> <span th:text="#{page.search}">Search</span></button>
        <a th:href="@{/tenants}" class="btn btn-outline-secondary" id="refreshBtn"><i class="bi bi-arrow-clockwise"></i> <span th:text="#{page.refresh}">Refresh</span></a>
    </div>
    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0" id="dataTable">
                <thead><tr><th>#</th><th th:text="#{tenant.code}">Code</th><th th:text="#{tenant.name}">Name</th><th th:text="#{tenant.description}">Description</th><th th:text="#{tenant.status}">Status</th><th th:text="#{page.actions}">Actions</th></tr></thead>
                <tbody id="dataRows">
                    <tr th:each="tenant, stat : ${tenants}">
                        <td th:text="${(pagination.currentPage - 1) * pagination.pageSize + stat.index + 1}"></td>
                        <td th:text="${tenant.code}"></td>
                        <td th:text="${tenant.name}"></td>
                        <td th:text="${tenant.description}"></td>
                        <td>
                            <span th:if="${tenant.status == 'ACTIVE'}" class="badge bg-success" th:text="#{tenant.status.active}">Active</span>
                            <span th:if="${tenant.status != 'ACTIVE'}" class="badge bg-secondary" th:text="#{tenant.status.inactive}">Inactive</span>
                        </td>
                        <td>
                            <a th:if="${#authorization.expression('hasAuthority(''TENANT_EDIT'')')}" th:href="@{/tenants/{id}/edit(id=${tenant.id})}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                            <form th:if="${#authorization.expression('hasAuthority(''TENANT_DELETE'')')}" th:action="@{/tenants/{id}/delete(id=${tenant.id})}" method="post" class="d-inline">
                                <button type="button" class="btn btn-sm btn-danger"
                                        data-bs-toggle="modal" data-bs-target="#confirmModal"
                                        th:data-modal-title="#{confirm.delete.tenant.title}"
                                        th:data-modal-body="#{confirm.delete.tenant.body}"
                                        th:data-modal-btn="#{modal.confirm.delete}"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(tenants)}"><td colspan="6" class="text-center text-muted py-4" th:text="#{tenant.notfound}">No tenants found</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <div th:replace="~{fragments/pagination :: pagination}"></div>

<script th:src="@{/js/list-manager.js}"></script>
<script th:src="@{/js/tenants/data-render.js}"></script>
</div>
</html>
