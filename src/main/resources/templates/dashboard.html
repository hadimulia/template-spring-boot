<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main :: layout}">
<head>
    <title th:text="#{app.dashboard}">Dashboard</title>
</head>
<body>
<div layout:fragment="content">
    <div th:replace="~{fragments/breadcrumb :: breadcrumb(#{app.dashboard})}"></div>
    <h4 class="mb-4" th:text="#{app.dashboard}">Dashboard</h4>

    <div class="row g-4">
        <div class="col-md-3">
            <div class="card bg-primary text-white h-100">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="card-title mb-0" th:text="#{dashboard.users}">Users</h6>
                        <h2 class="mb-0" th:text="${totalUsers}">0</h2>
                    </div>
                    <i class="bi bi-people" style="font-size: 2.5rem; opacity: 0.6;"></i>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-success text-white h-100">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="card-title mb-0" th:text="#{dashboard.roles}">Roles</h6>
                        <h2 class="mb-0" th:text="${totalRoles}">0</h2>
                    </div>
                    <i class="bi bi-shield-check" style="font-size: 2.5rem; opacity: 0.6;"></i>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-warning text-white h-100">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="card-title mb-0" th:text="#{dashboard.menus}">Menus</h6>
                        <h2 class="mb-0" th:text="${totalMenus}">0</h2>
                    </div>
                    <i class="bi bi-menu-app" style="font-size: 2.5rem; opacity: 0.6;"></i>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-info text-white h-100">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="card-title mb-0" th:text="#{dashboard.permissions}">Permissions</h6>
                        <h2 class="mb-0" th:text="${totalPermissions}">0</h2>
                    </div>
                    <i class="bi bi-key" style="font-size: 2.5rem; opacity: 0.6;"></i>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
