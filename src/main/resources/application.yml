spring:
  application:
    name: template-spring-boot
  profiles:
    active: dev
  messages:
    basename: i18n/messages
    encoding: UTF-8
  # Registry + school datasources. The registry DB holds the school list and
  # global login index; each school has its own database auto-created on demand.
  # spring.flyway is disabled: the registry realm migrates at startup and each
  # school DB is migrated by SchoolDataSourceManager when first created.
  flyway:
    enabled: false
  datasource:
    registry:
      db-name: sims_registry
      url: ${REGISTRY_DATABASE_URL:jdbc:postgresql://localhost:5432/sims_registry}
      username: ${REGISTRY_DATABASE_USERNAME:postgres}
      password: ${REGISTRY_DATABASE_PASSWORD:postgres}
      driver-class-name: org.postgresql.Driver
    school:
      url-prefix: ${SCHOOL_DATABASE_URL_PREFIX:jdbc:postgresql://localhost:5432/}
      admin-url: ${SCHOOL_DATABASE_ADMIN_URL:jdbc:postgresql://localhost:5432/postgres}
      username: ${SCHOOL_DATABASE_USERNAME:postgres}
      password: ${SCHOOL_DATABASE_PASSWORD:postgres}
      driver-class-name: org.postgresql.Driver
      max-pool-size: 10
  thymeleaf:
    cache: false
    encoding: UTF-8
    mode: HTML
    prefix: classpath:/templates/
    suffix: .html
  security:
    user:
      name: admin
      password: admin123

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.template.entity
  configuration:
    map-underscore-to-camel-case: true

mapper:
  mappers: tk.mybatis.mapper.common.Mapper
  not-empty: false
  identity: POSTGRES

logging:
  level:
    root: INFO
    com.template: DEBUG
