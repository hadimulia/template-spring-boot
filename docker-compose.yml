version: "3.9"

services:
  app:
    build: .
    container_name: template-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # Registry DB — holds the school list and login index.
      REGISTRY_DATABASE_URL: jdbc:postgresql://db:5432/sims_registry
      REGISTRY_DATABASE_USERNAME: postgres
      REGISTRY_DATABASE_PASSWORD: postgres
      # School DB template — the app auto-creates sims_<code> per school.
      SCHOOL_DATABASE_URL_PREFIX: jdbc:postgresql://db:5432/
      SCHOOL_DATABASE_ADMIN_URL: jdbc:postgresql://db:5432/postgres
      SCHOOL_DATABASE_USERNAME: postgres
      SCHOOL_DATABASE_PASSWORD: postgres
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: template-db
    ports:
      - "5432:5432"
    environment:
      # Maintenance DB used by the app to CREATE DATABASE sims_<code>.
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: